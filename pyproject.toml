[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-markdown"
version = "1.0.0"
description = "Standalone offline Windows desktop application for converting everyday English documents into clean Markdown for LLMs."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Local Markdown Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business"
]
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx,xls]==0.1.9",
    "PySide6>=6.6.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "olefile>=0.46",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
    "python-docx>=1.0.0",
    "xlwt>=1.3.0"
]

[project.scripts]
local-markdown = "local_markdown.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
