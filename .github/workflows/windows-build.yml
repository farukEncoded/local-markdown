name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.lock

      - name: Run Automated Tests
        run: |
          $env:PYTHONPATH = "src"
          pytest -v tests/unit tests/integration

      - name: Build Frozen Windows Application and Installer
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -SkipTests

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-markdown-windows-build
          path: dist_release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_release/LocalMarkdown-Setup-*.exe
            dist_release/LocalMarkdown-Portable-*.zip
            dist_release/SHA256SUMS.txt
          generate_release_notes: true
